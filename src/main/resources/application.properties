spring.application.name=database-backend
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kkirok?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@kkirok.app}}

app.external.mfds.raw-material.service-key=${MFDS_RAW_MATERIAL_SERVICE_KEY:}
app.external.mfds.product-ingredient.service-key=${MFDS_PRODUCT_INGREDIENT_SERVICE_KEY:}
app.external.mfds.nutrition.service-key=${MFDS_NUTRITION_SERVICE_KEY:}
app.external.mfds.timeout-ms=${MFDS_API_TIMEOUT_MS:5000}
